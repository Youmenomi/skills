name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: tools/check.sh
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHECK_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
        run: |
          # First push of a branch has an all-zero "before"; then there is nothing to range-check.
          if [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -q '^0*$' && git cat-file -e "$BEFORE" 2>/dev/null; then
            export CHECK_RANGE="$BEFORE..HEAD"
          fi
          bash tools/check.sh
